<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b32">
  <meta name="description" content="Organiza la adoración en familia: estudios, planificación, juegos, notas y recursos.">
  <title>Adoración en Familia</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-view="inicio">
        <span class="brand-mark">✦</span><span><b>ADORACIÓN</b><small>EN FAMILIA</small></span>
      </a>
      <div class="side-label">MENÚ PRINCIPAL</div>
      <nav class="nav">
        <button class="nav-link active" data-view="inicio"><span>⌂</span> Inicio</button>
        <button class="nav-link" data-view="estudios"><span>▤</span> Estudios bíblicos</button>
        <button class="nav-link" data-view="planificador"><span>▦</span> Planificador familiar</button>
        <button class="nav-link" data-view="juegos"><span>✧</span> Juegos y preguntas</button>
        <button class="nav-link" data-view="notas"><span>✎</span> Notas y progreso</button>
        <button class="nav-link" data-view="biblioteca"><span>▣</span> Biblioteca</button>
        <button class="nav-link" data-view="reuniones"><span>☷</span> Preparación de reuniones</button>
        <button class="nav-link" data-view="actividades"><span>♡</span> Niños y jóvenes</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="verse-card"><span class="verse-icon">❝</span><p>“Yo y mi casa, nosotros serviremos a Jehová”.</p><small>Josué 24:15</small></div>
        <button class="nav-link" data-view="ajustes"><span>⚙</span> Ajustes y datos</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">☰</button>
        <div class="breadcrumb"><span>ESPACIO FAMILIAR</span><b id="pageName">Inicio</b></div>
        <div class="top-actions">
          <span class="today" id="today"></span>
          <button class="avatar" id="quickAdd" title="Añadir contenido">＋</button>
        </div>
      </header>
      <div class="content" id="appContent"></div>
      <footer class="footer">ADORACIÓN EN FAMILIA <span>Un espacio para aprender, conversar y crecer juntos.</span></footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <dialog id="itemDialog">
    <form method="dialog" id="itemForm">
      <div class="dialog-head"><div><small id="dialogEyebrow">NUEVO CONTENIDO</small><h2 id="dialogTitle">Añadir</h2></div><button class="icon-btn" value="cancel" aria-label="Cerrar">×</button></div>
      <input type="hidden" id="itemId">
      <label>Título<input id="itemTitle" required maxlength="100" placeholder="Escribe un título"></label>
      <label>Fecha<input id="itemDate" type="date"></label>
      <label>Descripción o notas<textarea id="itemBody" rows="4" placeholder="Añade detalles, preguntas o ideas..."></textarea></label>
      <label id="categoryWrap">Categoría<select id="itemCategory"><option>Estudio bíblico</option><option>Actividad familiar</option><option>Reunión</option><option>Lectura</option><option>Otro</option></select></label>
      <div class="dialog-actions"><button class="btn btn-light" value="cancel">Cancelar</button><button class="btn btn-primary" id="saveItem" value="default">Guardar</button></div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
